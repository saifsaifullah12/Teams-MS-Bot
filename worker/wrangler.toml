name = "teams-ms-bot-worker"
main = "index.js"
compatibility_date = "2024-09-23"

[assets]
directory = "../client/dist"

[vars]
MICROSOFT_APP_ID = "your-bot-app-id"
MICROSOFT_APP_PASSWORD = "your-bot-client-secret"
MICROSOFT_TENANT_ID = "your-tenant-id"

# Optional: If you want persistent conversations across edge worker reboots,
# create a KV namespace: npx wrangler kv:namespace create "TEAMS_BOT_KV"
# and uncomment below:
# [[kv_namespaces]]
# binding = "TEAMS_BOT_KV"
# id = "your-kv-id"
